spring.application.name=authsvc
server.port=3000

# PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_HOST}
spring.jpa.database=postgresql
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
spring.data.redis.timeout=${REDIS_TIMEOUT:10000}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:10000}
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=10000ms

# JWT
security.jwt.secret=P$v7hR!a9K#zL@xQ*c2bE5gYfT4jN6mU1oW0sD3iR8yQ
security.jwt.expiration-seconds=3600

springdoc.swagger-ui.url=/openapi.yaml

# Actuator & Health
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.health.redis.enabled=true
